name: Agentic SEO (content rail)

# RAIL_VERSION: 2.0.0  (canonical; see seo/RAIL_VERSION on the installed repo)
# COA-00 v2 canonical template. Installed onto a client repo by the dashboard.
#
# DASHBOARD-DISPATCHED ONLY: there is intentionally NO `schedule:` block. The
# dashboard fires this via workflow_dispatch (staggered, capped, killable). Do not
# add a schedule; per-repo crons are out of the architecture.
#
# The {{PLACEHOLDERS}} are filled by the dashboard installer (Phase 5) from the
# repo's seo/site-adapter.md (build command, QA command, node version, and the
# path allowlist of files the agent may write). See CONTRACT.md.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "CHG-67: build THIS queued slug from seo/worked-log.csv (blank = auto, highest priority)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agentic-seo
  cancel-in-progress: false

jobs:
  build-one-page:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci

      - name: Build one briefed page (headless Claude Code)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CHG-67: the dashboard's chosen slug (blank = auto). Read via $TARGET_SLUG in
          # the prompt (env, not a ${{ }} interpolation into run:, to avoid injection).
          TARGET_SLUG: ${{ inputs.slug }}
        run: |
          # Model AND the claude-code version are PINNED (filled by the installer)
          # so runs are reproducible; both float if left unpinned.
          npx @anthropic-ai/claude-code@latest -p \
            "You are running one content build for this site. Read seo/site-adapter.md, seo/voice.md, seo/on-page-seo.md, seo/keyword-clusters.md, and seo/worked-log.csv.

            TARGET (CHG-67): '$TARGET_SLUG' (blank means auto).

            THROTTLE AND ENGINE RULES (hard):
            - PICK THE ROW: if TARGET is non-blank, build THAT slug's row in seo/worked-log.csv - it MUST have status 'queued' AND a matching brief in seo/build-briefs/. If the TARGET row is not 'queued' or has no matching brief, do NOT build: write seo-run-summary.md with its FIRST line EXACTLY 'MISROUTED: requested slug <TARGET> is not a queued row with a brief' and stop. If TARGET is blank, pick the SINGLE highest-priority row in seo/worked-log.csv with status 'queued' that HAS a matching brief in seo/build-briefs/ (P1 before P2 before P3). If none, exit without changes.
            - Read that brief. It MUST declare 'engine: rail' and be ADD-ONLY (it appends a NEW instance to an existing content array named in the site-adapter). If the brief is NOT add-only (it edits an existing page/slug, or needs a new route/template/component), do NOT build: write seo-run-summary.md with its FIRST line EXACTLY 'MISROUTED: <one-line reason>' and stop. Edits are the dashboard edit engine's job, never the rail's.

            BUILD:
            - Build EXACTLY ONE page by editing ONLY the content file(s) named in the site-adapter, appending new slugs only. Never edit an existing slug. Never touch components, routing, or design. Write in the client voice; facts only from seo/voice.md plus the brief's provided numbers; leave any 'verify before merge' flags intact.
            - COMPLETENESS (BUG-92/97, non-optional - a page that is not wired is not done): the site-adapter names EVERY array a page type must reach. Append the new page to the nav/index array(s) it names (e.g. serviceAreas), NOT only the content array, so it appears in the navbar dropdown, the footer, AND the index. A content-only append is an orphan even when a sibling component links it - seo-qa checks the page is linked FROM the nav/index surface in seo/nav-surfaces.json, not merely from a sibling. Fix any orphan/floor failure QA reports and rebuild; do NOT mark the row built until QA exits 0.
            - Run the site's build and QA exactly as seo/site-adapter.md specifies, and fix anything QA flags until it passes.
            - Update that row in seo/worked-log.csv to status 'built' with today's date. Write a plain-English summary to seo-run-summary.md at the repo root: state which page you built and which nav/index array(s) you appended it to. Describe the change in prose; do NOT enumerate file paths or a 'files edited' list - the workflow appends the authoritative list of changed files from the actual diff (BUG-152), so a hand-written list can only be wrong.
            - Do NOT git commit or push." \
            --model claude-sonnet-4-6 \
            --allowedTools "Read Edit Write Bash" \
            --permission-mode acceptEdits

      - name: Reject a misrouted (non-add-only) brief - fail loudly
        run: |
          if [ -f seo-run-summary.md ] && head -1 seo-run-summary.md | grep -q '^MISROUTED:'; then
            echo "Brief is not add-only; it must route to the dashboard edit engine, not the rail."
            cat seo-run-summary.md
            exit 1
          fi

      # CHG-109: the seo-qa em-dash ban (CHG-74) is not CI-gated, so the agent's own "seo-qa 0 failures"
      # self-check is not reliable for it (Altus failed twice while claiming clean). Deterministically
      # normalise em/en dashes in the lines the AGENT ADDED this run - the added hunks of the tracked diff
      # plus new untracked files - BEFORE the CI rebuild + the seo-qa gate. Em dash -> spaced hyphen, en
      # dash -> hyphen. ADDED lines only, so a PR never carries a dash edit outside the agent's own copy.
      - name: Normalise dashes in agent-changed files (CHG-74)
        run: |
          EXT_RE='\.(js|jsx|ts|tsx|md|mdx|json|csv|html)$'
          norm_added() { ADDED="$2" perl -CSD -i -pe 'BEGIN{%A=map{$_=>1}split " ",($ENV{ADDED}||"")} if($A{$.}){s/[ \t]*\x{2014}[ \t]*/ - /g; s/\x{2013}/-/g}' "$1"; }
          norm_all()   { perl -CSD -i -pe 's/[ \t]*\x{2014}[ \t]*/ - /g; s/\x{2013}/-/g' "$1"; }
          added_lines() { git diff -U0 HEAD -- "$1" | perl -ne 'if(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/){$s=$1;$n=defined $2?$2:1;print $s+$_," " for 0..$n-1}'; }
          touched=''
          for f in $(git diff --name-only --diff-filter=ACMR HEAD | grep -E "$EXT_RE" || true); do
            [ -f "$f" ] || continue
            L=$(added_lines "$f"); [ -n "$L" ] || continue
            b=$(cksum "$f"); norm_added "$f" "$L"; [ "$(cksum "$f")" != "$b" ] && touched="$touched $f"
          done
          for f in $(git ls-files --others --exclude-standard | grep -E "$EXT_RE" || true); do
            [ -f "$f" ] || continue
            b=$(cksum "$f"); norm_all "$f"; [ "$(cksum "$f")" != "$b" ] && touched="$touched $f"
          done
          if [ -n "$touched" ]; then echo "CHG-109: normalised dashes in:$touched"; else echo "CHG-109: no em/en dashes in agent-added lines."; fi

      # BUG-63: three explicit gates, per the plan (CI rebuild + SCOPED lint + seo-qa).
      # The build is unscoped (the agent's page must not break the site). The lint is
      # scoped to only the files the agent changed this run, so a repo's pre-existing
      # lint debt in files the agent never touched can't block a clean build.
      - name: Rebuild (CI confirmation)
        run: |
          npm run build

      - name: Scoped lint (agent-changed files only)
        run: |
          # The agent's edits are uncommitted at this point (peter-evans commits
          # after). So the changed set is the working-tree diff vs HEAD plus any new
          # untracked file, filtered to lintable extensions.
          CHANGED="$(git diff --name-only --diff-filter=ACMR HEAD -- '*.js' '*.jsx' '*.ts' '*.tsx'; git ls-files --others --exclude-standard -- '*.js' '*.jsx' '*.ts' '*.tsx')"
          CHANGED="$(printf '%s\n' $CHANGED | sort -u | sed '/^$/d')"
          if [ -z "$CHANGED" ]; then
            echo "Scoped lint: no changed JS/TS files to lint."
          elif [ ! -x node_modules/.bin/eslint ]; then
            echo "Scoped lint: eslint is not installed in this repo - skipping (build + seo-qa still gate)."
          else
            echo "Scoped lint on the files the agent changed:"
            echo "$CHANGED"
            npx eslint $CHANGED
          fi

      - name: Keyword router selftest (COA-07)
        run: |
          if [ -f scripts/route-keywords.mjs ]; then
            node scripts/route-keywords.mjs --selftest
          else
            echo "route-keywords.mjs not present - skipping (older install)."
          fi

      - name: SEO QA gate
        run: |
          node scripts/seo-qa.mjs

      - name: Run metadata + PR-body fallback
        id: meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          if [ ! -s seo-run-summary.md ]; then
            printf 'Agentic SEO run: the agent did not write a summary. Review the diff before merging.\n' > seo-run-summary.md
          fi

      # BUG-152: fail the run if the agent edited a file OUTSIDE the commit allowlist (peter-evans
      # would silently drop it), and rewrite the PR body's "Files changed" section FROM THE DIFF, so
      # the body lists exactly the files in its own PR instead of the plan the agent intended.
      - name: Verify the diff matches the PR body (BUG-152)
        run: |
          node scripts/rail-diff-check.mjs

      - name: Open the PR
        uses: peter-evans/create-pull-request@v6
        with:
          # The SAME GitHub PAT this client is connected with in the dashboard,
          # stored here as a repo Actions secret (a workflow cannot read the
          # dashboard's copy). A real PAT - not the built-in GITHUB_TOKEN - so the
          # content PR triggers status checks + the Vercel preview.
          token: ${{ secrets.GH_AGENT_TOKEN }}
          # Date-suffixed so unmerged weeks never collide.
          branch: seo/agent-run-${{ steps.meta.outputs.date }}
          delete-branch: true
          title: "Agentic SEO: proposed page"
          body-path: seo-run-summary.md
          labels: agentic-seo
          # Path allowlist: the agent may only ever touch these. Filled by the
          # installer from the site-adapter's content-file path(s).
          add-paths: |
            src/config/brand-dna.js
            seo/worked-log.csv
