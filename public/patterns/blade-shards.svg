<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- V6 dark texture (2B C2): giant diagonal blade shards, 55-65 degree edges.
       Fills use currentColor at whisper opacities (0.04-0.06); one shard carries
       a subtle linear-gradient sheen (0.06 to 0.02). Single large tile so the
       repeat is invisible at section scale; all shapes stay inside the tile. -->
  <defs>
    <linearGradient id="shard-sheen" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.06" />
      <stop offset="1" stop-color="currentColor" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <polygon points="480,60 760,60 360,840 80,840" fill="url(#shard-sheen)" />
  <polygon points="1020,140 1220,140 860,860 660,860" fill="currentColor" fill-opacity="0.05" />
  <polygon points="1450,40 1560,40 1230,700 1120,700" fill="currentColor" fill-opacity="0.04" />
  <polygon points="300,180 390,180 210,540 120,540" fill="currentColor" fill-opacity="0.06" />
</svg>
