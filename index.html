<!doctype html>
<html data-theme-mode="light" lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- LCP: preload the hero image so the fetch starts before the prerendered
         hero markup is parsed. Per-route <title>, meta, canonical, OG, and
         JSON-LD are owned by src/components/SEO.jsx and baked into each
         prerendered route by vite-react-ssg. inject-theme.mjs sets
         data-theme-mode on <html> above. Keep this head minimal so we never
         ship duplicate title/meta tags alongside the SEO component. -->
  <link rel="preload" as="image" href="/hero-image.webp" media="(min-width: 769px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/hero-image-mobile.webp" media="(max-width: 768px)" fetchpriority="high" />
  <!-- Google Tag Manager -->
  <script>(function (w, d, s, l, i) {
      w[l] = w[l] || []; w[l].push({
        'gtm.start':
          new Date().getTime(), event: 'gtm.js'
      }); var f = d.getElementsByTagName(s)[0],
        j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
          'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
    })(window, document, 'script', 'dataLayer', 'GTM-W24J27N8');</script>
  <!-- End Google Tag Manager -->
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W24J27N8" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- CallRail dynamic number swap. Baked into the SSG template so it loads once
       per full page load on every route and is never re-injected on SPA
       navigation. `async` keeps it off the render path. swap.js self-initialises
       and attaches its own MutationObserver to document.body, so it re-swaps
       phone numbers automatically as React renders each client-side route — no
       manual re-init needed. Coexists with GTM/GA and the LeadConnector widget
       (it only registers the global `window.CallTrk`). -->
  <script type="text/javascript" async src="//cdn.callrail.com/companies/164056385/40773248e88a73909807/12/swap.js"></script>
  <!-- LeadConnector chat widget. Lives in the SSG template so it is baked into
       every prerendered page and executes exactly once per full page load;
       client-side (SPA) route changes never re-inject it, so it can't duplicate.
       Placed last in <body> so it never blocks render or hurts Core Web Vitals. -->
  <script src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6a29696fc85a68345daf1b08"></script>
</body>

</html>
