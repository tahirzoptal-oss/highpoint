<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <pattern id="herringbone" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45 0 0)">
      <g fill="none" stroke="currentColor" stroke-linecap="square">
        <!-- interlocking herringbone bricks (16 x 8) -->
        <rect x="0" y="0" width="16" height="8" stroke-width="1.3" opacity="0.9" />
        <rect x="16" y="0" width="8" height="16" stroke-width="1.3" opacity="0.9" />
        <rect x="0" y="8" width="8" height="16" stroke-width="1.3" opacity="0.9" />
        <rect x="8" y="16" width="16" height="8" stroke-width="1.3" opacity="0.9" />
        <rect x="24" y="8" width="8" height="16" stroke-width="1.3" opacity="0.9" />
        <rect x="16" y="24" width="16" height="8" stroke-width="1.3" opacity="0.9" />
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#herringbone)" />
</svg>
